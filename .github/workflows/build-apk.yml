name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: ⚙️ Generate Native Android Code (Expo Prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_URL: https://stalk-api.ahsanul.dev
          EXPO_PUBLIC_SOCKET_URL: https://stalk-api.ahsanul.dev

      - name: 🔑 Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🏗️ Assemble Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_API_URL: https://stalk-api.ahsanul.dev
          EXPO_PUBLIC_SOCKET_URL: https://stalk-api.ahsanul.dev

      - name: 🔍 Find and Prepare Generated APK
        id: find_apk
        run: |
          mkdir -p build_output
          APK_FILE=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in build outputs!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build_output/stalk-app-release.apk
          ls -lh build_output/stalk-app-release.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stalk-app-release
          path: build_output/stalk-app-release.apk
          retention-days: 30

      - name: 🏷️ Upload APK to GitHub Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/stalk-app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
